<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적 리스트</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:13px;color:#333;background:#f5f6f9}
button,input{font-family:inherit}
.page{width:100%;min-height:100vh;padding:30px 36px}
.page-title{margin-bottom:26px}
.page-title h2{margin:0 0 8px;font-size:20px;font-weight:700;color:#222}
.page-title p{margin:0;font-size:12px;color:#888}

/* 검색 영역 */
.search-panel{margin-bottom:28px;padding:20px 24px;background:#fff;border:1px solid #e6e8ec}
.search-row{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.search-item{display:flex;align-items:center;gap:12px;min-width:0}
.search-item.customer{width:520px}
.search-label{flex:0 0 64px;margin:0;color:#333;font-size:12px;font-weight:700;white-space:nowrap;text-align:right}
.customer-search-wrap{display:flex;flex:1;min-width:0}

input[type="text"]{
    width:100%;
    height:34px;
    padding:0 10px;
    border:1px solid #d5d9df;
    border-radius:3px;
    background:#fff;
    color:#444;
    font-size:12px;
    outline:none
}

input[type="text"]:focus{border-color:#367bd8}

.search-button{
    flex:0 0 78px;
    height:29px;
    margin-left:10px;
    padding:0 12px;
    border:0;
    border-radius:3px;
    background:#64676c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    white-space:nowrap
}

.search-button img{display:block;width:15px;height:15px;object-fit:contain}
.search-button:hover{background:#484b50}

/* 리스트 */
.result-header{display:flex;align-items:center;margin-bottom:12px;font-size:12px;font-weight:700}
.result-count{margin-left:4px;color:#1769e0}
.grid-wrap{overflow-x:auto;border:1px solid #e1e3e7;background:#fff}

table{
    width:100%;
    min-width:1180px;
    border-collapse:collapse;
    table-layout:fixed
}

thead th{
    height:38px;
    padding:0 10px;
    background:#dfe7f5;
    color:#30343b;
    font-size:13px;
    font-weight:700;
    text-align:center;
    border-bottom:1px solid #d7dce4
}

tbody td{
    height:42px;
    padding:0 12px;
    border-bottom:1px solid #eceef1;
    color:#444;
    font-size:13px;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

tbody tr:hover{background:#f3f3f3}
tbody tr:last-child td{border-bottom:0}
.content-cell,.note-cell{text-align:left}
.no-data{height:100px!important;color:#999!important;text-align:center!important}

@media (max-width:800px){
    .page{padding:20px}
    .search-item.customer{width:100%}
    .search-label{flex-basis:64px;text-align:left}
}
</style>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="common.css">
    <script src="common-layout.js" defer></script>
</head>

<body>

<div class="page">

    <div class="page-title">
        <h2>견적 리스트</h2>
        <p>거래처별 견적 내역을 조회할 수 있습니다.</p>
    </div>

    <div class="search-panel">
        <div class="search-row">

            <div class="search-item customer">
                <div class="search-label">거래처</div>

                <div class="customer-search-wrap">
                    <input
                        type="text"
                        id="customerFilter"
                        placeholder="거래처 검색"
                    >

                    <button
                        type="button"
                        class="search-button"
                        id="customerSearchBtn"
                        title="검색"
                    >
                        <img src="/images/common/ico_search_white.svg" alt="">
                        <span>검색</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="result-header">
        견적 목록
        <span class="result-count" id="resultCount">(0)</span>
    </div>

    <div class="grid-wrap">
        <table>

            <colgroup>
                <col style="width:18%">
                <col style="width:10%">
                <col style="width:10%">
                <col style="width:10%">
                <col style="width:12%">
                <col style="width:24%">
                <col style="width:16%">
            </colgroup>

            <thead>
            <tr>
                <th>STL Profit simulation</th>
                <th>수신</th>
                <th>참조</th>
                <th>발신</th>
                <th>일자</th>
                <th>내용</th>
                <th>특기사항</th>
            </tr>
            </thead>

            <tbody id="estimateTableBody"></tbody>

        </table>
    </div>

</div>

<script>
const estimateData = [
    {
        id:1,
        customer:"트루인포",
        to:"김영수",
        cc:"박현우",
        from:"최사랑",
        date:"2026-09-17",
        content:"혈액투석 장비 및 소모품 견적",
        note:"계약조건 협의 필요"
    },
    {
        id:2,
        customer:"서울메디텍",
        to:"이정민",
        cc:"홍길동",
        from:"편호성",
        date:"2026-09-15",
        content:"신규 장비 도입 관련 견적",
        note:"납기 일정 확인"
    },
    {
        id:3,
        customer:"세림메디칼",
        to:"박민수",
        cc:"",
        from:"권용훈",
        date:"2026-09-12",
        content:"소모품 단가 조정 견적",
        note:""
    },
    {
        id:4,
        customer:"한빛병원",
        to:"김성훈",
        cc:"이현주",
        from:"최사랑",
        date:"2026-09-10",
        content:"장비 교체 및 유지보수 견적",
        note:"기존 계약 검토"
    },
    {
        id:5,
        customer:"미래헬스케어",
        to:"정다은",
        cc:"",
        from:"편호성",
        date:"2026-09-08",
        content:"신규 제품 견적 요청 건",
        note:"가격 재검토"
    },
    {
        id:6,
        customer:"트루인포",
        to:"김영수",
        cc:"박현우",
        from:"권용훈",
        date:"2026-09-03",
        content:"추가 소모품 공급 견적",
        note:"수량 확정 후 재견적"
    }
];

const tableBody = document.getElementById("estimateTableBody");
const resultCount = document.getElementById("resultCount");
const customerFilter = document.getElementById("customerFilter");

function renderTable(){
    const keyword = customerFilter.value.trim().toLowerCase();

    const filtered = estimateData.filter(item =>
        keyword === "" || item.customer.toLowerCase().includes(keyword)
    );

    resultCount.textContent = `(${filtered.length})`;
    tableBody.innerHTML = "";

    if(filtered.length === 0){
        tableBody.innerHTML = `
            <tr>
                <td colspan="7" class="no-data">조회된 견적 내역이 없습니다.</td>
            </tr>
        `;
        return;
    }

    filtered.forEach(item => {
        const tr = document.createElement("tr");

        tr.style.cursor = "pointer";

        tr.innerHTML = `
            <td>${item.customer}</td>
            <td>${item.to || "-"}</td>
            <td>${item.cc || "-"}</td>
            <td>${item.from || "-"}</td>
            <td>${item.date}</td>
            <td class="content-cell" title="${item.content}">${item.content}</td>
            <td class="note-cell" title="${item.note || ""}">${item.note || "-"}</td>
        `;

        tr.addEventListener("click", function(){
            openEstimate(item);
        });

        tableBody.appendChild(tr);
    });
}

document.getElementById("customerSearchBtn").addEventListener("click", renderTable);

customerFilter.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        renderTable();
    }
});

renderTable();

function openEstimate(item){
    sessionStorage.setItem(
        "selectedEstimate",
        JSON.stringify(item)
    );

    sessionStorage.removeItem("selectedSimulation");

    const template = item.template || "5008";

    location.href =
        `estimate-detail.html?id=${encodeURIComponent(item.id)}&template=${encodeURIComponent(template)}`;
}
</script>

</body>
</html>
