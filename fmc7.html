<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거래처, 신규 선택</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
    font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
    font-size:13px;
    color:#333;
    background:#f5f6f9;
}
button,input,select{font-family:inherit}

:root{
    --primary:#0b48b9;
    --primary-hover:#083b98;
    --border:#e2e5e9;
    --muted:#888;
}

/* =========================================================
   Layout
========================================================= */
.page{
    width:100%;
    min-height:100vh;
    padding:30px 36px 40px;
}

.page-title{
    margin-bottom:24px;
}

.page-title h2{
    margin:0 0 8px;
    font-size:20px;
    font-weight:700;
    color:#222;
}

.page-title p{
    margin:0;
    font-size:12px;
    color:#888;
}

/* =========================================================
   검색 영역
========================================================= */
.search-panel{
    margin-bottom:26px;
    padding:18px 22px;
    border:1px solid #e6e8ec;
    background:#fff;
}

.search-row{
    display:flex;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
}

.search-item{
    display:flex;
    align-items:center;
    gap:12px;
}

.search-label{
    min-width:54px;
    font-size:12px;
    font-weight:700;
    color:#333;
    text-align:right;
    white-space:nowrap;
}

select,
input[type="text"],
input[type="number"]{
    height:34px;
    padding:0 10px;
    border:1px solid #d5d9df;
    border-radius:3px;
    background:#fff;
    color:#444;
    font-size:12px;
    outline:none;
}

select:focus,
input:focus{
    border-color:#367bd8;
}

.search-item.customer{
    width:520px;
}

.customer-search-wrap{
    flex:1;
    display:flex;
    min-width:0;
}

.customer-search-wrap input{
    width:100%;
}

.search-button{
    flex:0 0 78px;
    height:29px;
    margin-left:10px;
    padding:0 12px;
    border:0;
    border-radius:3px;
    background:#64676c;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.search-button img{
    width:15px;
    height:15px;
    object-fit:contain;
}

.search-button:hover{
    background:#484b50;
}

/* =========================================================
   결과 헤더
========================================================= */
.result-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.result-title{
    font-size:12px;
    font-weight:700;
}

.result-count{
    margin-left:4px;
    color:#1769e0;
}

.new-start-btn{
    min-width:112px;
    height:34px;
    padding:0 18px;
    border:1px solid #043d93;
    border-radius:3px;
    background:#043d93;
    color:#fff;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.new-start-btn:hover{
    background:#063c95;
}

/* =========================================================
   카드 3열
========================================================= */
.card-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
}

.customer-card{
    min-height:160px;
    padding:18px 18px 16px;
    border:1px solid #e1e4e8;
    border-radius:4px;
    background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,.04);
    display:flex;
    flex-direction:column;
    transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease;
}

.customer-card:hover{
    border-color:#cbd4e2;
    box-shadow:0 4px 12px rgba(33,53,85,.08);
    transform:translateY(-1px);
}

.card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:10px;
}

.customer-name{
    margin:0;
    font-size:15px;
    font-weight:700;
    color:#222;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.card-divider{
    height:1px;
    margin:0 0 14px;
    background:#eceef1;
}

.card-action-top{
    flex:0 0 auto;
    min-width:78px;
    height:30px;
    padding:0 14px;
    border:1px solid #1769e0;
    border-radius:100px;
    background:#fff;
    color:#1769e0;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
}

.card-action-top:hover{
    border: 2px solid #1769e0;
    background: #e9f1ff;
    color: #0759c7;
    font-weight: 700;

}

.card-info{
    display:grid;
    grid-template-columns:64px 1fr;
    row-gap:8px;
    margin-bottom:18px;
    font-size:12px;
}

.info-label{
    color:#92979e;
}

.info-value{
    color:#454a51;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}



.no-data{
    grid-column:1/-1;
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #e1e3e7;
    background:#fff;
    color:#999;
}

/* =========================================================
   Popup
========================================================= */
.modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.46);
}

.modal-overlay.show{
    display:flex;
}

.modal{
    width:560px;
    max-width:100%;
    background:#fff;
    border:1px solid #9fa3aa;
    box-shadow:0 8px 25px rgba(0,0,0,.18);
    animation:modalOpen .14s ease-out;
}

@keyframes modalOpen{
    from{opacity:0;transform:translateY(-8px)}
    to{opacity:1;transform:translateY(0)}
}

.modal-header{
    height:48px;
    padding:0 20px;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-title{
    font-size:14px;
    font-weight:700;
    color:#222;
}

.modal-close{
    width:30px;
    height:30px;
    padding:0;
    border:0;
    background:transparent;
    color:#555;
    font-size:22px;
    cursor:pointer;
}

.modal-body{
    padding:24px 28px 28px;
}

.modal-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px 18px;
}

.modal-field{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
}

.modal-label{
    font-size:12px;
    font-weight:700;
    color:#333;
}

.modal-field input{
    width:100%;
}

.modal-field input[readonly]{
    background:#f5f5f5;
    color:#777;
}

.modal-footer{
    display:flex;
    height:48px;
}

.modal-action{
    flex:1;
    border:0;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
}

.close-btn{
    background:#666;
}
.close-btn:hover{
    background:#555;
}

.register-btn{
    background:#043d93;
}
.register-btn:hover{
    background:#063c95;
}

@media(max-width:980px){
    .card-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

@media(max-width:700px){
    .page{
        padding:20px;
    }

    .search-item.customer{
        min-width:100%;
    }

    .card-grid{
        grid-template-columns:1fr;
    }

    .modal-grid{
        grid-template-columns:1fr;
    }
}
</style>

<div class="page">

    <div class="page-title">
        <h2>거래처, 신규 선택</h2>
        <p>거래처를 선택하여 작성 중인 시뮬레이션을 이어서 진행하거나 새로 시작할 수 있습니다.</p>
    </div>

    <div class="search-panel">
        <div class="search-row">

            <div class="search-item customer">
                <div class="search-label">거래처</div>

                <div class="customer-search-wrap">
                    <input
                        type="text"
                        id="customerFilter"
                        placeholder="거래처 검색"
                    >

                    <button
                        type="button"
                        class="search-button"
                        id="customerSearchBtn"
                    >
                        <img src="/images/common/ico_search_white.svg" alt="">
                        <span>검색</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div class="result-header">

        <div class="result-title">
            검색 결과
            <span class="result-count" id="resultCount">(0)</span>
        </div>

        <!-- 요청대로 우선 버튼만 생성 -->
        <button
            type="button"
            class="new-start-btn"
            id="globalNewStartBtn">
            신규거래처 작성
        </button>

    </div>

    <div class="card-grid" id="customerCardGrid"></div>

</div>

<!-- =========================================================
     카드 작성중 / 새로시작 Popup
========================================================= -->
<div class="modal-overlay" id="modalOverlay">

    <div class="modal">

        <div class="modal-header">
            <div class="modal-title" id="modalTitle">거래처 정보</div>

            <button
                type="button"
                class="modal-close"
                id="modalClose">
                ×
            </button>
        </div>

        <div class="modal-body">

            <div class="modal-grid">

                <div class="modal-field">
                    <label class="modal-label">거래처</label>
                    <input
                        type="text"
                        id="modalCustomerName"
                        readonly
                    >
                </div>

                <div class="modal-field">
                    <label class="modal-label">SAP No</label>
                    <input
                        type="text"
                        id="modalSapNo"
                        readonly
                    >
                </div>

                <div class="modal-field">
                    <label class="modal-label">Contract DSO(일)</label>
                    <input
                        type="text"
                        id="modalContractDso"
                        min="0"
                    >
                </div>

                <div class="modal-field">
                    <label class="modal-label">Actual DSO(일)</label>
                    <input
                        type="text"
                        id="modalActualDso"
                        min="0"
                    >
                </div>

                <div class="modal-field">
                    <label class="modal-label">FxRate</label>
                    <input
                        type="text"
                        id="modalFxRate"
                        inputmode="numeric"
                        pattern="[0-9]*"
                    >
                </div>

            </div>

        </div>

        <div class="modal-footer">
            <button
                type="button"
                class="modal-action close-btn"
                id="closeBtn">
                닫기
            </button>

            <button
                type="button"
                class="modal-action register-btn"
                id="registerBtn">
                등록
            </button>
        </div>

    </div>

</div>


<!-- =========================================================
     신규거래처 작성 전용 팝업
     기존 modal 구조와 완전히 분리
========================================================= -->
<div id="fmc7HospitalOverlay" aria-hidden="true">
    <div class="fmc7-hospital-popup" role="dialog" aria-modal="true" aria-labelledby="fmc7HospitalTitle">

        <div class="fmc7-hospital-head">
            <h2 class="fmc7-hospital-title" id="fmc7HospitalTitle">병원 정보</h2>
        </div>

        <div class="fmc7-hospital-body">
            <div class="fmc7-hospital-grid">

                <!-- 고객명 : 2열 전체 -->
                <div class="fmc7-hospital-field fmc7-hospital-field-full">
                    <label
                        class="fmc7-hospital-label"
                        for="fmc7NewCustomerName">
                        거래처명
                    </label>

                    <input
                        class="fmc7-hospital-input"
                        id="fmc7NewCustomerName"
                        type="text"
                        placeholder="거래처명을 입력하세요">
                </div>


                <!-- 2번째 줄 왼쪽 -->
                <div class="fmc7-hospital-field">
                    <label
                        class="fmc7-hospital-label"
                        for="fmc7NewContractDso">
                        Contract DSO(일)
                    </label>

                    <input
                        class="fmc7-hospital-input"
                        id="fmc7NewContractDso"
                        type="text">
                </div>


                <!-- 2번째 줄 오른쪽 -->
                <div class="fmc7-hospital-field">
                    <label
                        class="fmc7-hospital-label"
                        for="fmc7NewActualDso">
                        Actual DSO(일)
                    </label>

                    <input
                        class="fmc7-hospital-input"
                        id="fmc7NewActualDso"
                        type="text">
                </div>


                <!-- 3번째 줄 왼쪽만 -->
                <div class="fmc7-hospital-field">
                    <label
                        class="fmc7-hospital-label"
                        for="fmc7NewFxRate">
                        FX rate
                    </label>

                    <input
                        class="fmc7-hospital-input"
                        id="fmc7NewFxRate"
                        type="text">
                </div>
            </div>

            <div class="fmc7-hospital-confirm">
                <input class="fmc7-hospital-check" id="fmc7NewConfirm" type="checkbox">
                <label class="fmc7-hospital-confirm-label" for="fmc7NewConfirm">거래처 등록은 추후에 추가하시기 바랍니다.</label>
            </div>
        </div>

        <div class="fmc7-hospital-footer">
            <button class="fmc7-hospital-btn fmc7-hospital-close" id="fmc7HospitalCloseBtn" type="button">취소</button>
            <button class="fmc7-hospital-btn fmc7-hospital-submit" id="fmc7HospitalRegisterBtn" type="button">등록</button>
        </div>

    </div>
</div>

        type:"기타",

        modified:"2026-09-12 09:17",
        progress:true,
        contractDso:40,
        actualDso:35,
        fxRate:1378
    },
    {
        id:9,

        type:"의원",

        modified:"2026-09-11 18:31",
        progress:false,
        contractDso:"",
        actualDso:"",
        fxRate:""
    }
];

let selectedCustomerId = null;
let selectedAction = "";

const customerCardGrid = document.getElementById("customerCardGrid");
const resultCount = document.getElementById("resultCount");
const customerFilter = document.getElementById("customerFilter");
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalCustomerName = document.getElementById("modalCustomerName");
const modalSapNo = document.getElementById("modalSapNo");
const modalContractDso = document.getElementById("modalContractDso");
const modalActualDso = document.getElementById("modalActualDso");
const modalFxRate = document.getElementById("modalFxRate");

/* FxRate는 소수점 없이 정수만 입력 */
modalFxRate.addEventListener("input", function(){
    this.value = this.value.replace(/[^0-9]/g, "");
});

function renderCards(){

    const keyword =
        customerFilter.value
            .trim()
            .toLowerCase();

const filtered =
        customerData.filter(item => {

            const matchCustomer =
                keyword === ""
                || item.customer
                    .toLowerCase()
                    .includes(keyword);

            return matchCustomer;
        });

    resultCount.textContent = `(${filtered.length})`;
    customerCardGrid.innerHTML = "";

    if(filtered.length === 0){

        customerCardGrid.innerHTML = `
            <div class="no-data">
                조회된 거래처가 없습니다.
            </div>
        `;

        return;
    }

    filtered.forEach(item => {

    const card = document.createElement("div");

    card.className = "customer-card";
    card.style.cursor = "pointer";

    card.addEventListener("click", function(){
        window.location.href = "fmc9.html";
    });

        card.innerHTML = `
            <div class="card-top">
                <h3 class="customer-name" title="${item.customer}">
                    ${item.customer}
                </h3>

                <button
                    type="button"
                    class="card-action-top"
                    data-id="${item.id}"
                    data-action="${item.progress ? "작성중" : "새로시작"}">
                    ${item.progress ? "작성중" : "새로시작"}
                </button>
            </div>

            <div class="card-divider"></div>

            <div class="card-info">
                <div class="info-label">연락처</div>
                <div class="info-value">${item.phone}</div>

                <div class="info-label">최근 수정</div>
                <div class="info-value">${item.modified}</div>
            </div>
        `;

        customerCardGrid.appendChild(card);
    });

    bindCardButtons();
}

function bindCardButtons(){

    document
        .querySelectorAll(".card-action-top")
        .forEach(button => {

            button.addEventListener("click", function(e){

                e.stopPropagation();

                const id = Number(this.dataset.id);
                const action = this.dataset.action;

                openModal(id, action);
            });
        });
}

function openModal(id, action){

    const record =
        customerData.find(item => item.id === id);

    if(!record) return;

    selectedCustomerId = id;
    selectedAction = action;

    modalTitle.textContent =
        action === "작성중"
            ? "작성 중인 거래처 정보"
            : "신규 거래처 시작";

    modalCustomerName.value = record.customer;
    modalSapNo.value = record.sapNo;

    if(action === "작성중"){
        modalContractDso.value = record.contractDso;
        modalActualDso.value = record.actualDso;
        const fxRateNumber =
            Number(String(record.fxRate).replace(/,/g, ""));

        modalFxRate.value =
            Number.isFinite(fxRateNumber)
                ? Math.trunc(fxRateNumber)
                : "";
    }else{
        modalContractDso.value = "";
        modalActualDso.value = "";
        modalFxRate.value = "";
    }

    modalOverlay.classList.add("show");
}

function closeModal(){

    modalOverlay.classList.remove("show");

    selectedCustomerId = null;
    selectedAction = "";
}

document
    .getElementById("modalClose")
    .addEventListener("click", closeModal);

document
    .getElementById("closeBtn")
    .addEventListener("click", closeModal);

modalOverlay.addEventListener("click", function(e){

    if(e.target === modalOverlay){
        closeModal();
    }
});

document.addEventListener("keydown", function(e){

    if(
        e.key === "Escape"
        && modalOverlay.classList.contains("show")
    ){
        closeModal();
    }
});

document
    .getElementById("registerBtn")
    .addEventListener("click", function(){

        const record =
            customerData.find(
                item => item.id === selectedCustomerId
            );

        if(!record) return;

        if(modalContractDso.value === ""){
            alert("Contract DSO(일)를 입력해주세요.");
            modalContractDso.focus();
            return;
        }

        if(modalActualDso.value === ""){
            alert("Actual DSO(일)를 입력해주세요.");
            modalActualDso.focus();
            return;
        }

        if(modalFxRate.value.trim() === ""){
            alert("FxRate를 입력해주세요.");
            modalFxRate.focus();
            return;
        }

        record.contractDso = modalContractDso.value;
        record.actualDso = modalActualDso.value;
        record.fxRate =
            parseInt(modalFxRate.value, 10);

        /*
          실제 등록 API 호출 위치.
          새로시작인 경우 등록 후 작성중 상태로 바꾸는 데모 처리.
        */
        record.progress = true;
        record.modified = "2026-09-17 15:20";

        closeModal();
        renderCards();
    });

document
    .getElementById("customerSearchBtn")
    .addEventListener("click", renderCards);

customerFilter.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        renderCards();
    }
});

/* =========================================================
   신규거래처 작성 팝업
   기존 화면/기존 modal 동작은 건드리지 않음
========================================================= */
const fmc7HospitalOverlay =
    document.getElementById("fmc7HospitalOverlay");

const fmc7NewCustomerName =
    document.getElementById("fmc7NewCustomerName");

const fmc7NewContractDso =
    document.getElementById("fmc7NewContractDso");

const fmc7NewActualDso =
    document.getElementById("fmc7NewActualDso");

const fmc7NewFxRate =
    document.getElementById("fmc7NewFxRate");
const fmc7NewConfirm = document.getElementById("fmc7NewConfirm");

function openFmc7HospitalPopup(){

    fmc7NewCustomerName.value = "";
    fmc7NewContractDso.value = "";
    fmc7NewActualDso.value = "";
    fmc7NewFxRate.value = "";

    fmc7HospitalOverlay.classList.add("is-open");
    fmc7HospitalOverlay.setAttribute("aria-hidden", "false");

    document.body.style.overflow = "hidden";

    // setTimeout(function(){
    //     fmc7NewCustomerName.focus();
    // }, 0);
}

function closeFmc7HospitalPopup(){
    fmc7HospitalOverlay.classList.remove("is-open");
    fmc7HospitalOverlay.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
}

document
    .getElementById("globalNewStartBtn")
    .addEventListener("click", function(){
        openFmc7HospitalPopup();
    });

document
    .getElementById("fmc7HospitalCloseBtn")
    .addEventListener("click", closeFmc7HospitalPopup);

fmc7HospitalOverlay.addEventListener("click", function(e){
    if(e.target === fmc7HospitalOverlay){
        closeFmc7HospitalPopup();
    }
});

document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && fmc7HospitalOverlay.classList.contains("is-open")){
        closeFmc7HospitalPopup();
    }
});

document
    .getElementById("fmc7HospitalRegisterBtn")
    .addEventListener("click", function(){

        const customerName = fmc7NewCustomerName.value.trim();
        const sapNo = fmc7NewSapNo.value.trim();
        const contractDso = fmc7NewContractDso.value.trim();
        const actualDso = fmc7NewActualDso.value.trim();

        if(customerName === ""){
            alert("고객명을 입력해주세요.");
            fmc7NewCustomerName.focus();
            return;
        }

        if(sapNo === ""){
            alert("SAP No를 입력해주세요.");
            fmc7NewSapNo.focus();
            return;
        }

        if(contractDso === ""){
            alert("Contract DSO(일)를 입력해주세요.");
            fmc7NewContractDso.focus();
            return;
        }

        if(actualDso === ""){
            alert("Actual DSO(일)를 입력해주세요.");
            fmc7NewActualDso.focus();
            return;
        }

        if(!fmc7NewConfirm.checked){
            alert("입력한 고객 및 기본정보 확인에 체크해주세요.");
            fmc7NewConfirm.focus();
            return;
        }

        const now = new Date();
        const pad = value => String(value).padStart(2, "0");
        const modified =
            now.getFullYear() + "-"
            + pad(now.getMonth() + 1) + "-"
            + pad(now.getDate()) + " "
            + pad(now.getHours()) + ":"
            + pad(now.getMinutes());

        const newId = customerData.length
            ? Math.max(...customerData.map(item => item.id)) + 1
            : 1;

        customerData.unshift({
            id:newId,
            customer:customerName,
            type:fmc7NewHospitalType.value || "기타",
            sapNo:sapNo,
            phone:"-",
            modified:modified,
            progress:true,
            contractDso:Number(contractDso),
            actualDso:Number(actualDso),
            fxRate:""
        });

        closeFmc7HospitalPopup();
        renderCards();
    });

renderCards();
</script>
