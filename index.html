<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;color:#2d3138}
button,input{font-family:inherit}

:root{
    --primary:#0c42aa;
    --primary-hover:#08368d;
    --page-bg:#f1f2f5;
    --muted:#8c929b;
    --line:#d8dce4;
    --danger:#e85b61;
}

/* =========================
   전체 화면
========================= */
body{
    min-height:100vh;
    background:var(--page-bg);
}

.login-page{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
/* 배경 장식 */
/* 배경 장식 */
.bg-circle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}

.bg-circle.small{
    width:135px;
    height:135px;
    left:14%;
    top:16%;
    background:#e6e6e6;
}

.bg-circle.large{
    width:560px;
    height:560px;
    right:-190px;
    bottom:-185px;
    background:#e4e4e4;
}

/* =========================
   관리자 로그인 전환
   기본: 회색
   활성: 파란색 + "관리자 로그인" 표시
========================= */
.admin-switch{
    position:absolute;
    top:18px;
    left:18px;
    z-index:20;

    display:flex;
    align-items:center;

    height:38px;
    padding:0 11px;

    border:0;
    border-radius:7px;
    color:#dddddd;

    cursor:pointer;
    transition:background .18s ease,color .18s ease,box-shadow .18s ease;
    background-color: #f1f2f5;
}

.admin-switch.active{
    color:#0b42ab;
}

.admin-icon{
    width:18px;
    height:18px;
    flex:0 0 18px;
}

.admin-text{
    margin-left: 7px;
    max-width:0;
    opacity:0;
    overflow:hidden;
    white-space:nowrap;
    font-size:9px;
    font-weight:700;
    transition:max-width .22s ease,opacity .16s ease;
}

.admin-switch.active .admin-text{
    max-width:105px;
    opacity:1;
}

/* =========================
   중앙 로그인 카드
========================= */
.content{
    position:relative;
    z-index:2;
    flex:1;
    min-height:610px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:72px 24px 52px;
}

.login-card{
    width:760px;
    max-width:100%;
    min-height:430px;
    display:grid;
    grid-template-columns:285px 1fr;
    overflow:hidden;

    border-radius:8px;
    background:#fff;
    box-shadow:0 4px 14px rgba(30,40,60,.18);
}

/* 왼쪽 브랜드 영역 */
.brand-panel{
    background:#0b42ab;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.brand-logo{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: -7px;
}

.brand-logo img{
    display:block;
    width:205px;
    max-width:100%;
    height:auto;
    filter:brightness(0) invert(1);
    margin-top: -25px;
}

.brand-message{
    color:#fff;
    font-size:15px;
    font-weight:700;
    line-height:1.55;
    letter-spacing:-0.5px;
}

.brand-desc{
    margin:0;
    color:#a9bde9;
    font-size:11.5px;
    font-weight:400;
    line-height:1.55;
    letter-spacing:-0.25px;
}

/* 오른쪽 로그인 영역 */
.form-panel{
    padding:49px 64px 42px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.login-title{
    margin:0 0 27px;
    font-size:24px;
    font-weight:700;
    text-align:center;
    color:#333;
}

.login-title::after{
    content:"";
    display:block;
    width:21px;
    height:3px;
    margin:7px auto 0;
    border-radius:2px;
    background:var(--primary);
}

.field{
    margin-bottom:21px;
}

.field-label{
    display:block;
    margin-bottom:6px;
    font-size:11.5px;
    font-weight:700;
    color:#4d5259;
}

.input-line{
    position:relative;
}

.input-line input{
    width:100%;
    height:33px;
    padding:0 34px 0 0;
    border:0;
    border-bottom:1px solid #bbc1c9;
    border-radius:0;
    outline:none;
    background:transparent;
    color:#333;
    font-size:13px;
    transition:border-color .15s ease;
}

.input-line input::placeholder{
    color:#c4c8cd;
}

.input-line input:focus{
    border-bottom:2px solid var(--primary);
}

.input-status{
    position:absolute;
    right:1px;
    top:50%;
    transform:translateY(-50%);                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
    

    width:19px;
    height:19px;
    border-radius:50%;
    background:#c8cbd0;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:700;
}

.input-status.valid{
    background:var(--primary);
}

.password-toggle{
    position:absolute;
    right:23px;
    top:50%;
    transform:translateY(-50%);
    width:23px;
    height:25px;
    border:0;
    background:transparent;
    color:#9298a0;
    cursor:pointer;
    display:none;
}

.error-message{
    min-height:17px;
    margin-top:7px;
    color:var(--danger);
    font-size:10.5px;
    display:flex;
    align-items:center;
    gap:6px;
}

.error-icon{
    flex:0 0 18px;
    width:18px;
    height:18px;
    border:1.5px solid var(--danger);
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    color:var(--danger);
    font-size:12px;
    font-weight:700;
}

.login-options{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    margin:2px 0 27px;
}

.remember-label{
    display:flex;
    align-items:center;
    gap:7px;
    color:#555b63;
    font-size:11.5px;
    cursor:pointer;
}

.remember-label input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.fake-check{
    width:17px;
    height:17px;
    border:1px solid #b7bdc5;
    border-radius:3px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
}

.remember-label input:checked + .fake-check{
    border-color:var(--primary);
    background:var(--primary);
}

.remember-label input:checked + .fake-check::after{
    content:"✓";
    color:#fff;
    font-size:11px;
    font-weight:700;
}

.login-btn{
    display:block;
    width:190px;
    height:38px;
    margin:0 auto;
    border:0;
    border-radius:3px;
    background:var(--primary);
    color:#fff;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease;
}

.login-btn:hover{
    background:var(--primary-hover);
}

.mode-guide{
    height:18px;
    margin-top:5px;
    margin-left: 4px;
    text-align:center;
    font-size:10px;
    color:#8b919a;
    opacity:0;
    transition:opacity .15s ease;
}

.mode-guide.show{
    opacity:1;
    color:var(--primary);
    font-weight:700;
}

/* =========================
   하단
========================= */
.footer{
    position:relative;
    z-index:3;
    height:47px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#7a7a7a;
    color:#eee;
    font-size:9px;
}

/* =========================
   반응형
========================= */
@media(max-width:760px){
    .content{
        align-items:flex-start;
        padding-top:82px;
    }

    .login-card{
        width:430px;
        grid-template-columns:1fr;
    }

    .brand-panel{
        min-height:155px;
        padding:25px 30px;
    }

    .brand-logo{
        margin-bottom:18px;
    }

    .brand-logo img{
        width:180px;
    }

    .brand-message{
        margin-bottom:13px;
        font-size:17px;
    }

    .brand-desc{
        display:block;
        font-size:12px;
    }

    .form-panel{
        padding:38px 42px 40px;
    }

    .bg-circle.small{
        left:-50px;
    }
}

@media(max-width:480px){
    .admin-switch{
        top:12px;
        left:12px;
    }

    .content{
        padding:70px 14px 35px;
    }

    .form-panel{
        padding:32px 26px 35px;
    }

    .footer{
        padding:0 12px;
        text-align:center;
    }
}
</style>
</head>

            <div class="form-panel">

                <h1 class="login-title">Login</h1>

                <form id="loginForm" autocomplete="off">

                    <div class="field">
                        <label class="field-label" for="loginId">ID</label>

                        <div class="input-line">
                            <input
                                type="text"
                                id="loginId"
                                name="loginId"
                                value="basarajiny"
                                autocomplete="username"
                            >
                            <span class="input-status valid" id="idStatus">✓</span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" for="loginPassword">PASSWORD</label>

                        <div class="input-line">
                            <input
                                type="password"
                                id="loginPassword"
                                name="loginPassword"
                                placeholder="비밀번호를 입력해주세요"
                                autocomplete="current-password"
                            >
                            <span class="input-status" id="passwordStatus">✓</span>
                        </div>

                        <div class="error-message" id="loginError">
                            <span class="error-icon">!</span>
                            <span class="error-text">아이디 또는 비밀번호가 일치하지 않습니다.</span>
                        </div>
                    </div>

                    <div class="login-options">
                        <!-- 기존 관리자 체크 영역은 삭제하고 ID 저장만 유지 -->
                        <label class="remember-label">
                            <input type="checkbox" id="rememberId" checked>
                            <span class="fake-check"></span>
                            <span>아이디 저장</span>
                        </label>
                    </div>

                    <button type="submit" class="login-btn">
                        LOGIN
                    </button>
                </form>

            </div>

</div>

<script>
const adminSwitch = document.getElementById("adminSwitch");
const loginForm = document.getElementById("loginForm");
const loginId = document.getElementById("loginId");
const loginPassword = document.getElementById("loginPassword");

const idStatus = document.getElementById("idStatus");
const passwordStatus = document.getElementById("passwordStatus");
const loginError = document.getElementById("loginError");
const rememberId = document.getElementById("rememberId");

let isAdminMode = false;

/* =========================================================
   관리자 로그인 모드 전환
========================================================= */
adminSwitch.addEventListener("click", function(){

    isAdminMode = !isAdminMode;

    this.classList.toggle("active", isAdminMode);
    this.setAttribute("aria-pressed", String(isAdminMode));

    /*
      실제 로그인 API 호출 시 아래 isAdminMode 값을 이용해
      일반 로그인 / 관리자 로그인 분기 처리하면 됩니다.
    */
});

/* =========================================================
   입력 상태 표시
========================================================= */
function updateInputStatus(){

    const hasId = loginId.value.trim() !== "";
    const hasPassword = loginPassword.value !== "";

    idStatus.classList.toggle("valid", hasId);
    passwordStatus.classList.toggle("valid", hasPassword);
}

loginId.addEventListener("input", updateInputStatus);
loginPassword.addEventListener("input", function(){
    updateInputStatus();

    if(this.value){
        loginError.textContent = "";
    }
});

/* =========================================================
   ID 저장
========================================================= */
const savedId = localStorage.getItem("savedLoginId");

if(savedId){
    loginId.value = savedId;
    rememberId.checked = true;
}

function saveRememberId(){

    if(rememberId.checked){
        localStorage.setItem(
            "savedLoginId",
            loginId.value.trim()
        );
    }else{
        localStorage.removeItem("savedLoginId");
    }
}

/* =========================================================
   로그인 데모
========================================================= */
loginForm.addEventListener("submit", function(e){

    e.preventDefault();

    const id = loginId.value.trim();
    const password = loginPassword.value;

    if(!id){
        loginError.textContent = "아이디를 입력해주세요.";
        loginId.focus();
        return;
    }

    if(!password){
        loginError.textContent = "비밀번호를 입력해주세요.";
        loginPassword.focus();
        return;
    }

    saveRememberId();

    /*
      실제 환경에서는 여기서 API를 호출하면 됩니다.

      예)
      login({
          id: id,
          password: password,
          isAdmin: isAdminMode
      });
    */

    // 테스트용 정적 페이지: 선택한 로그인 모드를 세션에 저장한 뒤 공통 레이아웃 페이지로 이동
    sessionStorage.setItem("fmcLoginMode", isAdminMode ? "admin" : "sales");
    window.location.href = "fmc4.html";
});

updateInputStatus();
</script>
